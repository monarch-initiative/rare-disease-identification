id: https://w3id.org/rare-disease-identification/functional-capacity
name: functional_capacity
title: Functional Capacity Assessment Schema
description: >-
  Two curated, evidence-backed assessments per rare disease: whether affected
  people can sustain work, and whether they need daily personal care.

  Every assessment carries an explicit impairment level, the computed score that
  proposed it, and a list of evidence lines drawn from five independent lanes.
  Nothing is silent: a disease with no evidence says UNKNOWN and says why.

  Evidence structure follows SEPIO via `monarch-initiative/sieve`
  (EvidenceLine = direction + strength + item), flattened for hand-curation.

prefixes:
  linkml: https://w3id.org/linkml/
  rdid: https://w3id.org/rare-disease-identification/
  MONDO: http://purl.obolibrary.org/obo/MONDO_
  ORPHA: http://www.orpha.net/ORDO/Orphanet_
  PMID: http://identifiers.org/pubmed/
  ECO: http://purl.obolibrary.org/obo/ECO_
  # linkml-lint prefers https://icd.codes/icd10cm/ here. Kept on the BioPortal
  # namespace deliberately: it is what the Mondo xrefs and the state code lists
  # both use, so changing it would break the join that populates this lane.
  ICD10CM: http://purl.bioontology.org/ontology/ICD10CM/
  oa: http://www.w3.org/ns/oa#
  dcterms: http://purl.org/dc/terms/
  RDIDRUN: https://w3id.org/rare-disease-identification/run/
  SSACAL: https://secure.ssa.gov/apps10/poms.nsf/lnx/
  MTFRAIL: https://w3id.org/rare-disease-identification/montana-frail/
  HP: http://purl.obolibrary.org/obo/HP_
  HPOA: https://w3id.org/rare-disease-identification/hpoa/
  RDIDAGENT: https://w3id.org/rare-disease-identification/agent/
  ORCID: http://identifiers.org/orcid/

default_prefix: rdid
default_range: string
imports:
  - linkml:types

enums:

  ImpairmentLevelEnum:
    description: >-
      How much the disease impairs the capacity in question, for a typical
      affected person under standard of care. Mirrors Orphanet's severity
      bands (Low / Moderate / Severe / Complete) so the two can be compared.
    permissible_values:
      NONE:
        description: Typical affected people are not meaningfully impaired in this capacity.
      MILD:
        description: Harder, but most affected people manage without help or accommodation.
      SUBSTANTIAL:
        description: >-
          A serious barrier. A substantial proportion (>=30%) need accommodation,
          reduced hours, or regular assistance.
      TOTAL:
        description: >-
          A substantial proportion (>=30%) cannot sustain competitive employment at
          all, or need daily personal assistance from another person.
      VARIABLE:
        description: >-
          Genuinely varies by subtype, stage, or treatment response; no single level
          is representative. Use the rationale to say what it varies with.
      NOT_APPLICABLE:
        description: >-
          The question does not arise. Chiefly: work capacity for a disease that is
          near-universally lethal before working age.
      UNKNOWN:
        description: Not yet assessed, or assessed and found to have no usable evidence.

  CareContextEnum:
    description: >-
      Which course the assessment describes. Required, because untreated natural
      history and treated course diverge sharply for screened metabolic disease
      and this is the single largest source of false positives.
    permissible_values:
      STANDARD_OF_CARE_TREATED:
        description: The course under current standard of care. The only context that may inform policy use.
      UNTREATED_NATURAL_HISTORY:
        description: The untreated course. Must never be presented as the current expectation.
      TREATMENT_REFRACTORY:
        description: The course in people who do not respond to standard treatment.
      UNKNOWN:
        description: The source does not say which course it describes.

  LifeStageEnum:
    description: The life stage the assessment applies to.
    permissible_values:
      CONGENITAL: {description: "Present from birth"}
      PAEDIATRIC: {description: "Onset and impact in childhood"}
      ADULT_ONSET: {description: "Onset in adulthood"}
      PROGRESSIVE_LATE_STAGE: {description: "Applies only once the disease has progressed"}
      ANY: {description: "Applies across life stages"}
      PRE_MANIFEST_EXCLUDED: {description: "Explicitly excludes pre-manifest carriers"}

  EvidenceLaneEnum:
    description: >-
      The independent lanes evidence can come from. A well-curated assessment draws on
      more than one, and lanes that disagree are recorded, not reconciled away.

      Policy evidence is split in two because a federal disability adjudication and a
      state Medicaid frailty code are genuinely independent decisions - different
      statutes, different bodies, different qualifying tests - and collapsing them into
      one lane made concordant government determinations look like a single source.
    permissible_values:
      EXPERT_DATABASE:
        description: >-
          A curated database rating functional consequence directly - chiefly Orphanet's
          functional-consequences dataset, which names its validating expert.
      FEDERAL_POLICY_LIST:
        description: >-
          A national-level determination that this disease qualifies, made by the body
          that administers the benefit - chiefly the SSA Compassionate Allowances list
          (POMS DI 23022.080), which certifies that a condition precludes substantial
          gainful activity. Because that is an adjudication of the work question itself
          rather than a proxy for it, this lane is only used on work_capacity.
      STATE_POLICY_LIST:
        description: >-
          A sub-national government or payer list that already treats this disease as
          qualifying - state Medicaid medically-frail condition lists, which are keyed to
          ICD-10-CM codes. Independent of the federal lane: different statute, different
          body, different qualifying test.
      LITERATURE:
        description: >-
          A peer-reviewed publication reporting employment, ADL, caregiver-burden or
          functional outcomes. Requires a verified quote.
      MODEL_JUDGEMENT:
        description: >-
          A language model's structured judgement from the disease description.
          Never sufficient alone; benchmarked against EXPERT_DATABASE before use.
      PHENOTYPE_ANCHOR:
        description: >-
          Specific, functionally decisive HPO findings that HPOA curates as occurring in >=30%
          of affected people - the same bar the impairment levels use. Structurally this is the
          same kind of object as an Orphanet row (a named finding with a curated frequency), and
          unlike COMPUTED_SCORE it cites the findings rather than a weighted sum of them.

          Benchmarked against the 538-disease Orphanet validation set, the tightest usable rule
          reaches a positive predictive value of only 59-65%, so this lane must never set a level
          on its own: one assertion in three would be wrong. Its purpose is to make an UNKNOWN
          legible - to say what the phenotype profile suggests and why it was not enough.

          Derived from the same HPOA data as COMPUTED_SCORE, so the two are never independent
          sources and this lane replaces rather than supplements that one.
      COMPUTED_SCORE:
        description: >-
          The phenotype-based score. A ranking signal, not a finding.

  EvidenceDirectionEnum:
    description: Whether this evidence line supports or disputes the assessment.
    permissible_values:
      SUPPORTS: {description: "Supports the stated impairment level"}
      DISPUTES: {description: "Argues for a lower impairment level than stated"}
      NEUTRAL: {description: "Relevant but does not move the assessment"}

  EvidenceStrengthEnum:
    description: How much weight this line carries.
    permissible_values:
      STRONG:
        description: >-
          Direct measurement in an identified human cohort, or a named expert's
          rating of this specific disease.
      MODERATE:
        description: Indirect, small, or from a closely related disease.
      WEAK:
        description: Inference, opinion, or unbenchmarked model output.

  FCCurationStatusEnum:
    description: Curation lifecycle of the assessment.
    permissible_values:
      UNREVIEWED: {description: "Proposed by pipeline, no curator has looked"}
      AI_CURATED: {description: "Evidence gathered and synthesised by an agent, awaiting human review"}
      EXPERT_REVIEWED: {description: "A named human clinician has reviewed and accepted"}
      DISPUTED: {description: "Evidence lanes conflict and a human must resolve"}
      REJECTED: {description: "Reviewed and rejected; kept so the rejection is visible"}

  CuratorTypeEnum2:
    description: Who produced an evidence line.
    permissible_values:
      AI_AGENT: {description: "LLM-based agent"}
      PIPELINE: {description: "Deterministic script"}
      HUMAN: {description: "Human curator"}

classes:

  FunctionalCapacityEvidence:
    description: >-
      One evidence line. Flattened SEPIO EvidenceLine: what kind of evidence,
      which way it points, how strong, and the item itself.
    attributes:
      lane:
        description: >-
          Which of the independent sources this line came from. Two lines from the same lane
          never satisfy the two-source rule for SUBSTANTIAL.
        range: EvidenceLaneEnum
        required: true
      direction:
        range: EvidenceDirectionEnum
        required: true
        ifabsent: string(SUPPORTS)
        description: >-
          HOW TO POPULATE. Direction is about the LEVEL, not about disease severity - a line can
          describe a devastating disease and still argue the level down.

          For Orphanet rows, map frequency onto the >=30% bar the levels use: "Very frequent"
          and "Frequent" clear it and SUPPORT; "Occasional" sits below it and DISPUTES, however
          severe the limitation. Severity "Low" or "Unspecified" also DISPUTES, because a
          frequency without a severity carries no claim. Temporality matters equally: a
          "Transient" limitation in a relapsing or episodic disease DISPUTES a permanent level.

          A treatment line that reports recovery, or outcomes only achieved under therapy,
          DISPUTES an assessment built on untreated natural history.
      strength:
        range: EvidenceStrengthEnum
        required: true
        description: >-
          HOW TO POPULATE. This slot gates which levels are reachable, so calibrate it before
          the level, not after.

          * STRONG - a direct measurement in an identified human cohort of n >= 20, or a named
            expert's rating of this specific disease (Orphanet with StatusDisability Validated
            AND an expert named in SourceOfValidation).
          * MODERATE - a cohort under ~20, a single centre, a narrative review, a
            related-disease proxy, a non-expert-validated Orphanet record, a policy listing, or
            a PHENOTYPE_ANCHOR line.
          * WEAK - inference, expert opinion without data, model output, or the phenotype score.

          If you find yourself reaching for STRONG to unlock TOTAL, that is the signal to stop.
      reference:
        description: >-
          Identifier for the evidence item. PMID:12345678, ORPHA:558,
          ICD10CM:G40.81, a state list name, or a model run id.
        range: uriorcurie
        required: true
        slot_uri: dcterms:references
        pattern: '^(PMID|DOI|PMC|ORPHA|ICD10CM|SSACAL|MTFRAIL|HPOA|RDIDRUN):\S+$'
        # `implements` as well as `slot_uri`: upstream field detection accepts
        # either, but the vendored snippet audit only reads `implements`.
        implements:
          - linkml:authoritative_reference
      reference_title:
        description: Title of the cited work, or name of the source list.
        range: string
        slot_uri: dcterms:title
      quote:
        description: >-
          Exact quote from the source that carries the claim. Required for
          LITERATURE and EXPERT_DATABASE lanes. Must be verifiable verbatim.
        range: string
        slot_uri: oa:exact
        implements:
          - linkml:excerpt
      quote_verified:
        description: >-
          Whether the quote was machine-checked against the cached source.
          Never set this by hand - the validator sets it.
        range: boolean
      source_statement:
        description: >-
          For EXPERT_DATABASE and the two policy lanes, the structured assertion the
          source makes, e.g. "Engaging in paid work in a standard environment | Frequent | Severe | Permanent".
        range: string
      population:
        description: Cohort the evidence describes (n, country, age range, ascertainment).
        range: string
      explanation:
        description: One sentence on why this supports or disputes the assessment.
        range: string
        required: true
      eco_code:
        description: Evidence & Conclusion Ontology term, where one fits.
        range: uriorcurie
      curator:
        description: >-
          Optional attribution for this individual line, where it differs from the
          assessment-level assessed_by. Same identifier rules apply.
        range: string
      curator_type:
        description: >-
          Who produced this line. PIPELINE lines are pure functions of a source file and are
          regenerated on every build rather than trusted - an agent must never write or edit
          one. AI_AGENT and HUMAN lines carry judgement and cannot be regenerated.
        range: CuratorTypeEnum2
      retrieved_on:
        description: Date the cited source was fetched into references_cache/.
        range: date

  FunctionalCapacityAssessment:
    description: >-
      One curated capacity assessment for one disease. Either work capacity or
      care dependence - the two are separate assessments and are not derived
      from each other.
    attributes:
      impairment:
        range: ImpairmentLevelEnum
        required: true
        description: >-
          The headline judgement.

          HOW TO POPULATE. Not deterministic, so the rules are here rather than in a skill,
          because a reviewer disagreeing with a level needs to see the rule that produced it.
          Set the level from the evidence, never from `score`:

          * TOTAL - requires at least one line with strength STRONG. If the clinical picture
            looks total but no STRONG line exists, set SUBSTANTIAL and say so in `rationale`;
            do not promote a MODERATE line to reach the level you expected.
          * SUBSTANTIAL - requires two lines from DIFFERENT lanes agreeing. PHENOTYPE_ANCHOR and
            COMPUTED_SCORE are the same HPOA data and never count as two.
          * MILD / NONE - the evidence positively argues for a low level. Not a default.
          * VARIABLE - the outcome genuinely splits by subtype, stage or treatment access, and
            the evidence says so. Name what it varies with in `rationale`.
          * NOT_APPLICABLE - work_capacity only, where the disease is near-universally lethal
            before working age. Care dependence still applies.
          * UNKNOWN - fewer than two qualifying lines. `rationale` must then state what was
            searched. This is a completed curation, not a skipped one.

          Lanes that disagree are never averaged: set `curation_status: DISPUTED`, state both
          sides in `rationale`, and stop.
      score:
        range: float
        description: Computed phenotype score that proposed this. Ranking signal only.
      score_method:
        description: Which method produced `score`, e.g. "phenotype-wsum-norm".
        range: string
      score_version:
        description: Version or date of the scoring run, so a number can be reproduced.
        range: string
      model_confidence:
        description: >-
          Language-model confidence 0-100 from the MODEL_JUDGEMENT lane.

          HOW TO POPULATE. This is the model's confidence in the LEVEL it set, not in the
          disease being severe. It must never be used to justify a level - it is recorded so a
          reviewer can see where the agent was unsure, and so disagreements can be sorted by it.
          Expect low values (30-45) on UNKNOWN and on any level capped by evidence strength
          rather than by the clinical picture.
        range: integer
        minimum_value: 0
        maximum_value: 100
      care_context:
        description: >-
          Which course this assessment describes.

          HOW TO POPULATE. Ask what the evidence actually measured. If every line describes the
          course before treatment existed or without access to it, this is
          UNTREATED_NATURAL_HISTORY and the assessment must not reach a policy artefact. If the
          lines describe outcomes under current standard of care - including newborn screening,
          enzyme replacement, gene therapy or surgery - it is STANDARD_OF_CARE_TREATED. When the
          sources disagree about which course they describe, that is itself grounds for VARIABLE
          on the level. Never leave this at UNKNOWN when a level has been set.
        range: CareContextEnum
        required: true
      life_stage:
        description: >-
          The life stage this assessment applies to. Use PRE_MANIFEST_EXCLUDED for late-onset
          genetic disease where carriers before onset have no limitation, and
          PROGRESSIVE_LATE_STAGE where the level describes the advanced course rather than onset.
        range: LifeStageEnum
      rationale:
        description: >-
          Two or three sentences a clinician would recognise. Say what drives the level, and
          name the strongest disagreeing evidence if there is any.

          HOW TO POPULATE. It must be possible to check the level against this text alone.
          State (a) which line carries the level, (b) any line that argues the other way and
          why it did not win, and (c) if the level is capped by evidence strength rather than
          by the clinical picture, say so explicitly so a reviewer can raise it deliberately.
          For UNKNOWN, state what was searched and found absent. Do not restate the disease
          description; a reviewer already has it.
        range: string
        required: true
      evidence:
        description: >-
          Every line consulted, including those that argue against the level. Disagreement is
          recorded here rather than resolved away.
        range: FunctionalCapacityEvidence
        multivalued: true
        inlined_as_list: true
      curation_status:
        description: >-
          Lifecycle state. AI_CURATED is the ceiling for an agent - only a named human sets
          EXPERT_REVIEWED. Use DISPUTED when sources conflict and stop rather than averaging.
        range: FCCurationStatusEnum
        required: true
        ifabsent: string(UNREVIEWED)
      claims_selectable:
        description: >-
          Whether an ICD-10-CM code exists for this disease at all. Decides whether
          the disease can be screened from claims or needs an attestation route.
        range: boolean
      icd10cm_codes:
        description: >-
          ICD-10-CM codes as CURIEs, never bare codes. A bare "E83.01" is not resolvable and
          not checkable; ICD10CM:E83.01 expands through the prefix map and can be validated.
        range: uriorcurie
        multivalued: true
        pattern: '^ICD10CM:[A-Z][0-9A-Z.]+$'
      assessed_by:
        description: >-
          Agent or person that produced this assessment, as a resolvable identifier -
          an ORCID for a human, or the versioned skill id for an agent. Never a bare name:
          "N. Matentzoglu" and "curate-frailty skill" are not checkable, ORCID:0000-...
          and RDIDAGENT:curate-frailty/2026-09-16 are.
        range: uriorcurie
        pattern: '^(ORCID|RDIDAGENT):\S+$'
      assessed_on:
        description: >-
          Date this assessment was made. Load-bearing for provenance: it identifies which
          Orphanet and HPOA release the derived lines were computed against.
        range: date
      notes:
        description: >-
          Free text for anything that does not belong in rationale - open questions for a
          reviewer, subtype splits worth considering. Never used to justify the level.
        range: string

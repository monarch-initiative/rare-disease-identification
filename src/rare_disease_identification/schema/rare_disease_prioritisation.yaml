id: https://w3id.org/rare-disease-identification
name: rare_disease_prioritisation
title: Rare Disease Prioritisation Schema
description: >-
  Schema for prioritised rare diseases for phenotypic characterization,
  including drug-disease associations (indications, contraindications, research)
  merged from the MeDIC knowledge base.

prefixes:
  linkml: https://w3id.org/linkml/
  rdid: https://w3id.org/rare-disease-identification/
  MONDO: http://purl.obolibrary.org/obo/MONDO_
  HP: http://purl.obolibrary.org/obo/HP_
  ICD10CM: http://purl.bioontology.org/ontology/ICD10CM/
  SNOMEDCT: http://snomed.info/id/
  infores: https://w3id.org/information-resource-registry/
  skos: http://www.w3.org/2004/02/skos/core#

imports:
  - linkml:types
  - functional_capacity
  - value_set

default_range: string

enums:
  PrevalenceCategoryEnum:
    description: >-
      Prevalence category indicating whether the disease is low or high prevalence.
    permissible_values:
      L:
        description: Low prevalence
      H:
        description: High prevalence
      H_star:
        description: High prevalence in some populations
      H_uncertain:
        description: Uncertain high prevalence

  PrioritizationCategoryEnum:
    description: >-
      Category indicating the prioritization tier for the disease.
    permissible_values:
      initial:
        description: First expert-based prioritisation of diseases with high potential for phenotypic characterization impact
      expanded:
        description: Extended set of diseases added after initial expert review to broaden coverage

  RelationshipTypeEnum:
    description: Type of drug-disease relationship.
    permissible_values:
      INDICATION:
        description: Drug is indicated for the disease
      CONTRAINDICATION:
        description: Drug is contraindicated for the disease
      ADVERSE_EVENT:
        description: Drug is associated with an adverse event in the context of the disease
      RESEARCH:
        description: Drug is investigated for the disease (research / off-label)

  SourceRoleEnum:
    description: >-
      Whether a source is the primary canonical evidence record (e.g. official
      EMA EPAR) or an intermediary source (e.g. a DailyMed label that mirrors
      the FDA approval).
    permissible_values:
      PRIMARY:
        description: Primary canonical source for the assertion
      INTERMEDIARY:
        description: Intermediary source repeating or fallback to a primary source

  RegulatoryAuthorityEnum:
    description: Regulatory authority granting approval / market authorisation.
    permissible_values:
      FDA:
        description: U.S. Food and Drug Administration
      EMA:
        description: European Medicines Agency
      PMDA:
        description: Japan Pharmaceuticals and Medical Devices Agency
      CDSCO:
        description: India Central Drugs Standard Control Organisation
      OTHER:
        description: Other regulator

  RegulatoryStatusEnum:
    description: Regulatory approval status.
    permissible_values:
      APPROVED:
        description: Approved for marketing
      WITHDRAWN:
        description: Approval withdrawn
      DISCONTINUED:
        description: Discontinued
      INVESTIGATIONAL:
        description: Under investigation
      OFF_LABEL:
        description: Used off-label

  CurationStatusEnum:
    description: Curation lifecycle status of a drug-disease association.
    permissible_values:
      DRAFT:
        description: Draft / unreviewed
      IN_REVIEW:
        description: Under expert review
      APPROVED:
        description: Curator-approved
      REJECTED:
        description: Curator-rejected

  CuratorTypeEnum:
    description: Type of curator that produced an evidence record.
    permissible_values:
      AI_AGENT:
        description: AI agent (LLM-based or other)
      PIPELINE:
        description: Automated extraction pipeline
      HUMAN:
        description: Human curator

  SourceTypeEnum:
    description: Broad category of evidence source.
    permissible_values:
      REGULATORY:
        description: Regulatory agency document (label, EPAR, etc.)
      LITERATURE:
        description: Published literature (PMID, PMC, journal article)
      GUIDELINE:
        description: Clinical practice guideline
      DATABASE:
        description: Curated database or registry
      POST_MARKET:
        description: Post-market surveillance / real-world evidence

  ConfidenceEnum:
    description: Confidence level for an evidence record.
    permissible_values:
      LOW:
        description: Low confidence
      MEDIUM:
        description: Medium confidence
      HIGH:
        description: High confidence

  EvidenceSourceEnum:
    description: Provenance of the underlying evidence.
    permissible_values:
      HUMAN_CLINICAL:
        description: Human clinical evidence (trial, case report)
      MODEL_ORGANISM:
        description: Animal / model organism evidence
      IN_VITRO:
        description: In vitro / cell-based evidence
      COMPUTATIONAL:
        description: Computational / in silico evidence
      OTHER:
        description: Other / unspecified provenance

classes:
  SimpleTerm:
    description: >-
      A simple ontology term with an identifier and a label.
    attributes:
      id:
        description: The CURIE identifier for the term.
        range: string
        identifier: true
      label:
        description: The human-readable label for the term.
        range: string

  Source:
    description: A description of the source from which evidence was extracted.
    attributes:
      name:
        range: string
        description: Human-readable source name (e.g. "FDA DailyMed", "EMA EPAR", "PMDA").
      type:
        range: SourceTypeEnum
        description: Broad category of source.
      jurisdiction:
        range: string
        description: Regulatory jurisdiction (USA, EU, JAPAN, INTERNATIONAL, etc.)
      url:
        range: string
        description: URL for the source document or search.
      description:
        range: string
        description: Description of the source provenance.
      file:
        range: string
        description: Path to the source file (when available).

  Curator:
    description: The agent (human, pipeline or AI) that produced the evidence record.
    attributes:
      name:
        range: string
        description: Human-readable name of the curator.
      curator_type:
        range: CuratorTypeEnum
        description: Type of curator (AI_AGENT, PIPELINE, HUMAN).
      curator_id:
        range: string
        description: Stable identifier (URL, ORCID, etc.) for the curator.

  AggregateConfidence:
    description: >-
      MeDIC's rolled-up confidence for a whole drug-disease association,
      combining the per-assertion confidences across every source that
      produced the assertion.
    attributes:
      method:
        range: string
        description: Combination method used to roll up the assertions (e.g. NOISY_OR).
      overall:
        range: float
        description: Combined confidence in the association, 0-1.
      n_assertions:
        range: integer
        description: Number of individual assertions rolled up.
      n_sources:
        range: integer
        description: Number of distinct source documents the assertions came from.

  RegulatoryStatus:
    description: >-
      A regulatory market-authorisation record for a drug-disease relationship,
      recorded per authority. Multiple statuses can coexist (FDA, EMA, PMDA).
    attributes:
      authority:
        range: RegulatoryAuthorityEnum
        description: Regulatory authority that issued the status.
      status:
        range: RegulatoryStatusEnum
        description: Approval status with this authority.
      approval_date:
        range: string
        description: Approval date (ISO 8601 YYYY-MM-DD when known).
      source_role:
        range: SourceRoleEnum
        description: Whether this record is primary or intermediary.
      regulatory_document_url:
        range: string
        description: URL to the underlying regulatory document.
      source:
        range: string
        description: >-
          Source artefact that produced this record (DAILYMED, EMA_EPAR, PMDA,
          CDSCO). Disambiguates multiple records under one authority.
      source_document_url:
        range: string
        description: URL to the source document itself (PDF when available).
      setid:
        range: string
        description: DailyMed SPL setid (FDA records sourced from DailyMed).
      product_id:
        range: string
        description: Source-side product identifier, when the source carries one.

  Evidence:
    description: >-
      A single piece of evidence supporting or refuting a drug-disease association.
    attributes:
      source:
        range: Source
        inlined: true
        description: Structured description of the source.
      source_type:
        range: SourceTypeEnum
        description: Broad type of source (kept as a flat field for compatibility).
      source_role:
        range: SourceRoleEnum
        description: Primary canonical source vs intermediary fallback.
      jurisdiction:
        range: string
        description: Regulatory jurisdiction (USA, EU, JAPAN, INTERNATIONAL, ...).
      reference:
        range: string
        description: Reference identifier (PMID, PMC, NCT, DailyMed ID, URL, ...).
      reference_title:
        range: string
        description: Title of the referenced document.
      page_or_section:
        range: string
        description: Page range or section identifier within the referenced document.
      source_document_url:
        range: string
        description: URL to the actual source document (PDF when available).
      original_drug_label:
        range: string
        description: Drug label as it appeared in the source before grounding to a CURIE.
      original_drug_id:
        range: string
        description: Source-side drug identifier when the source carries one.
      original_disease_label:
        range: string
        description: Disease label as it appeared in the source before grounding to MONDO.
      setid:
        range: string
        description: DailyMed SPL setid (FDA DailyMed evidence rows).
      document_id:
        range: string
        description: Source-side document identifier for the artefact the assertion came from.
      product_id:
        range: string
        description: Source-side product identifier, when the source carries one.
      snippet:
        range: string
        description: Exact quote from the source document.
      explanation:
        range: string
        description: How this evidence supports or refutes the drug-disease association.
      support:
        range: string
        description: Whether evidence supports or refutes (SUPPORT, REFUTE, PARTIAL, NO_EVIDENCE).
      confidence:
        range: ConfidenceEnum
        description: Overall confidence level.
      confidence_drug:
        range: ConfidenceEnum
        description: Confidence in drug grounding.
      confidence_disease:
        range: ConfidenceEnum
        description: Confidence in disease grounding.
      confidence_association:
        range: ConfidenceEnum
        description: Confidence in the drug-disease association.
      evidence_source:
        range: EvidenceSourceEnum
        description: Provenance category (HUMAN_CLINICAL, MODEL_ORGANISM, etc.).
      approval_status:
        range: RegulatoryStatusEnum
        description: Clinical / regulatory approval status conveyed by this evidence.
      approval_date:
        range: string
        description: Approval date attached to this evidence (ISO 8601 YYYY-MM-DD when known).
      max_research_phase:
        range: string
        description: Maximum research phase (PRE_CLINICAL, PHASE_I-IV, CASE_REPORT, ...).
      curator:
        range: Curator
        inlined: true
        description: Curator that produced this evidence record.

  DrugAssociation:
    description: >-
      A drug associated with a disease in a specific modality (indication,
      contraindication, research), carrying evidence and modality-specific
      metadata (regulatory status, curation status, ...).
    attributes:
      drug_id:
        range: string
        description: >-
          Normalized drug identifier (CHEBI CURIE preferred). May be empty when
          the drug could not be grounded.
      drug_label:
        range: string
        required: true
        description: Drug name or label.
      relationship_type:
        range: RelationshipTypeEnum
        description: Relationship modality (INDICATION, CONTRAINDICATION, RESEARCH, ...).
      reliability:
        range: ConfidenceEnum
        description: >-
          MeDIC's banded reliability for the association as a whole (HIGH,
          MEDIUM, LOW), derived from the aggregate confidence.
      confidence:
        range: AggregateConfidence
        inlined: true
        description: Rolled-up confidence across all assertions for this association.
      is_allergen:
        range: boolean
        description: >-
          Whether the association reflects an allergy/hypersensitivity to the
          drug rather than a therapeutic relationship. Mostly set on
          contraindications.
      is_diagnostic_agent:
        range: boolean
        description: Whether the drug is a diagnostic agent rather than a therapeutic.
      regulatory_status:
        range: RegulatoryStatus
        multivalued: true
        inlined_as_list: true
        description: Per-authority regulatory status records (FDA, EMA, PMDA, ...).
      curation_status:
        range: CurationStatusEnum
        description: Curation lifecycle status (research associations only).
      curation_date:
        range: string
        description: ISO 8601 date when this association was curated.
      curator:
        range: Curator
        inlined: true
        description: Top-level curator for the association (research associations).
      deep_research_used:
        range: boolean
        description: Whether AI deep research was used to produce the association.
      notes:
        range: string
        description: Free-text curator notes about the association.
      evidence:
        range: Evidence
        multivalued: true
        inlined_as_list: true
        description: Evidence items supporting this association.

  RareDiseaseCollection:
    description: A collection of prioritised rare diseases.
    tree_root: true
    attributes:
      title:
        description: Title of the collection.
        range: string
      description:
        description: Description of the collection.
        range: string
      version:
        description: Version of the collection.
        range: string
      diseases:
        description: The list of prioritised rare diseases.
        range: RareDisease
        multivalued: true
        inlined_as_list: true

  RareDisease:
    description: A rare disease entry with prioritisation metadata.
    attributes:
      mondo_id:
        description: The MONDO identifier for the disease.
        range: string
        identifier: true
        pattern: "^MONDO:\\d{7}$"
      mondo_label:
        description: The primary disease name as recognised in medical literature.
        range: string
        required: true
      mondo_synonyms:
        description: Alternative names and terms used to refer to this disease.
        range: string
        multivalued: true
      work_capacity:
        description: >-
          Curated assessment of whether affected adults of working age can sustain
          competitive employment. See schema/functional_capacity.yaml.
        range: FunctionalCapacityAssessment
        inlined: true
      care_dependence:
        description: >-
          Curated assessment of whether affected people need substantial daily
          personal assistance or continuous supervision.
        range: FunctionalCapacityAssessment
        inlined: true
      hpo_high_level_categories:
        description: HPO high-level phenotype categories.
        range: SimpleTerm
        multivalued: true
        inlined_as_list: true
      histopheno_categories:
        description: Histopheno phenotype categories.
        range: string
        multivalued: true
      keywords:
        description: Keywords associated with the disease.
        range: string
        multivalued: true
      ontology_terminology_codes:
        description: >-
          Cross-references to other ontology or terminology codes
          (e.g. OMIM, MEDGEN, UMLS).
        range: string
        multivalued: true
      value_sets:
        description: >-
          Codes to query a patient record system with for this disease, one
          value set per terminology, each in three tiers. `exact` and `narrower`
          are regenerated from Mondo and are not hand-editable; `proxy` is
          curated. See schema/value_set.yaml.
        range: TerminologyValueSet
        multivalued: true
        inlined_as_list: true
      prevalence_category:
        description: >-
          Prevalence category: L (low), H (high), H* (high in some populations).
        range: PrevalenceCategoryEnum
      misdiagnosis_bias:
        description: >-
          Factors contributing to under- or mis-diagnosis, including
          potential demographic biases.
        range: string
      prevalence_per_100k_us:
        description: >-
          Disease prevalence per 100,000 people in the United States
          as reported in the literature.
        range: float
      prioritization_category:
        description: The prioritization tier for data collection effort.
        range: PrioritizationCategoryEnum
      justification_summary:
        description: >-
          Summary of justification for prioritization and potential for impact.
        range: string
        multivalued: true
      additional_justification:
        description: Additional justification detail.
        range: string
      hpo_treatment_rank:
        description: >-
          HPO profile and treatment-based rank score.
        range: float
      curated_hpo_profiles:
        description: Justification grouping based on curated HPO profiles.
        range: SimpleTerm
        multivalued: true
        inlined_as_list: true
      mondo_category_body_system:
        description: >-
          MONDO high-level category: of body system or component.
        range: SimpleTerm
        multivalued: true
        inlined_as_list: true
      mondo_category_developmental:
        description: >-
          MONDO high-level category: of developmental or physiological process.
        range: SimpleTerm
        multivalued: true
        inlined_as_list: true
      mondo_category_etiologic:
        description: >-
          MONDO high-level category: of etiologic mechanism.
        range: SimpleTerm
        multivalued: true
        inlined_as_list: true
      mondo_category_genetic:
        description: >-
          MONDO high-level category: of genetic or genomic mechanism.
        range: SimpleTerm
        multivalued: true
        inlined_as_list: true
      mondo_category_extrinsic:
        description: >-
          MONDO high-level category: of primarily extrinsic mechanism.
        range: SimpleTerm
        multivalued: true
        inlined_as_list: true
      mondo_category_molecular:
        description: >-
          MONDO high-level category: of molecular mechanism.
        range: SimpleTerm
        multivalued: true
        inlined_as_list: true
      indications:
        description: Approved drug indications for this disease.
        range: DrugAssociation
        multivalued: true
        inlined_as_list: true
      contraindications:
        description: Drugs contraindicated for this disease.
        range: DrugAssociation
        multivalued: true
        inlined_as_list: true
      research:
        description: Drug/treatment research entries for this disease.
        range: DrugAssociation
        multivalued: true
        inlined_as_list: true
